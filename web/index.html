<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Библиотека: каталог, читатели и выдачи книг.">
  <meta name="theme-color" content="#f6f8fc">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Библиотека</title>
  <style>
    body { margin: 0; background: #f6f8fc; color: #1e293b; font-family: Arial, sans-serif; }
    #startup { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 24px; }
    #spinner { width: 36px; height: 36px; border: 4px solid #dbe4f4; border-top-color: #4f5e9c;
      border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #spinner { animation: none; } }
    #startup button { padding: 12px 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="startup" role="status" aria-live="polite">
    <h1>Библиотека</h1>
    <div id="spinner" aria-hidden="true"></div>
    <p id="startup-message">Загружаем приложение…</p>
    <button id="retry-startup" hidden onclick="location.reload()">Повторить загрузку</button>
  </div>
  <noscript>Для работы библиотеки включите JavaScript в браузере.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('startup')?.remove();
    });
    window.showStartupError = function () {
      document.getElementById('startup-message').textContent =
        'Не удалось загрузить приложение. Проверьте соединение и повторите попытку.';
      document.getElementById('spinner').hidden = true;
      document.getElementById('retry-startup').hidden = false;
    };
  </script>
  <script src="flutter_bootstrap.js" async onerror="showStartupError()"></script>
</body>
</html>
